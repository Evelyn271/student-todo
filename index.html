<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生学习任务管理器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>学生学习任务管理器</h1>
    <p class="subtitle">记录每天的学习目标，稳步完成计划。</p>

    <form id="task-form" class="task-form">
      <input id="task-input" type="text" placeholder="例如：完成 JavaScript 练习" autocomplete="off">
      <button type="submit">添加任务</button>
    </form>

    <p id="empty-state" class="empty-state">暂时没有任务，添加一个今天的学习目标吧。</p>
    <ul id="task-list" class="task-list"></ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
